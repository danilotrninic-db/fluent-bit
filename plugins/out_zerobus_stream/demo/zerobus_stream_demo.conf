# zerobus_stream demo: dummy records streamed into a Zerobus table, dogfood
# staging by default. run_demo.sh sets the DEMO_* variables; the credentials
# come from the environment and never appear in this file.

[SERVICE]
    # A short flush keeps chunks small and the input from capping the rate
    Flush        0.2
    # Room to drain the buffered chunks when run_demo.sh stops the run
    Grace        30
    Log_Level    info
    # proc_records counts a record only after its chunk returned FLB_OK,
    # which this plugin does only once the server acknowledged it.
    HTTP_Server  On
    HTTP_Listen  127.0.0.1
    HTTP_Port    ${DEMO_HTTP_PORT}

# Two generators, each offering half the rate: one dummy input offers at
# most about 400 MB/s
[INPUT]
    Name           dummy
    Tag            demo
    Threaded       on
    # DEMO_TICKS times a second, DEMO_COPIES records each
    Rate           ${DEMO_TICKS}
    Copies         ${DEMO_COPIES}
    # Bounds the backlog when the output is slower than the input. Chunks
    # stay here until acknowledged, so it also bounds the bytes in flight.
    Mem_Buf_Limit  ${DEMO_INPUT_BUF_LIMIT}
    # run_demo.sh builds the record: an air quality row whose device_name
    # starts with the run tag and pads it to DEMO_RECORD_BYTES of JSON
    Dummy          ${DEMO_RECORD}

[INPUT]
    Name           dummy
    Tag            demo
    Threaded       on
    Rate           ${DEMO_TICKS}
    Copies         ${DEMO_COPIES}
    Mem_Buf_Limit  ${DEMO_INPUT_BUF_LIMIT}
    Dummy          ${DEMO_RECORD}

[OUTPUT]
    Name                    zerobus_stream
    Match                   demo
    # debug logs each chunk's acknowledgment: stream, records, offset
    Log_Level               ${DEMO_LOG_LEVEL}
    endpoint                ${DEMO_ENDPOINT}
    unity_catalog_endpoint  ${DEMO_UC_ENDPOINT}
    table_name              ${DEMO_TABLE}
    client_id               ${DATABRICKS_CLIENT_ID}
    client_secret           ${DATABRICKS_CLIENT_SECRET}
    streams                 ${DEMO_STREAMS}
    async_ack               ${DEMO_ASYNC_ACK}
    Workers                 ${DEMO_WORKERS}
    Retry_Limit             5
